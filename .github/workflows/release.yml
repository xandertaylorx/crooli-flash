name: Release

# Push a tag such as v1.0.1 to build the Mac and Windows apps and publish them as a GitHub release.
# The install commands on crooli.com/flash always fetch the latest release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/test-worker.mjs

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: |
              dist/Crooli-Flash-mac-arm64.zip
              dist/Crooli-Flash-mac-x64.zip
          - os: windows-latest
            script: dist:win
            files: |
              dist/Crooli-Flash-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run icons
      - run: npm run ${{ matrix.script }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
